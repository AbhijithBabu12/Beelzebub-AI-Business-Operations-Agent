services:
  db:
    image: postgres:16
    container_name: beelzebub-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: beelzebub
      POSTGRES_USER: beelzebub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beelzebub -d beelzebub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: